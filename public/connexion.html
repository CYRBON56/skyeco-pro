<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connexion — Skyeco Pro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #14312a;
    background: #f5f8f6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: white;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .brand { font-weight: 800; font-size: 1.3rem; color: #1e6f4c; margin-bottom: 4px; }
  h1 { font-size: 1.3rem; margin: 6px 0 24px; }
  label { display: block; font-weight: 600; font-size: 0.88rem; margin: 16px 0 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d8e3de;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: #1e6f4c; }
  .btn {
    width: 100%;
    background: #1e6f4c;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    margin-top: 24px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.6; }
  .error { color: #991b1b; font-size: 0.88rem; margin-top: 12px; }
  .footer-link { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #5b6b64; }
  .footer-link a { color: #1e6f4c; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Skyeco Pro</div>
  <h1>Connexion</h1>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="vous@entreprise.fr" />

  <label for="motdepasse">Mot de passe</label>
  <input type="password" id="motdepasse" placeholder="Votre mot de passe" />

  <button class="btn" id="btnConnexion">Se connecter</button>
  <div id="errorBox"></div>

  <div class="footer-link">Pas encore de compte ? <a href="/inscription.html">Créer mon compte</a></div>
</div>

<script>
  const SUPABASE_URL = "https://heviivnlswohnrzcguxv.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_un7u9BDV_1IL3EjYTuAoOg_ZUKZ-ZjW";

  const btn = document.getElementById("btnConnexion");
  const errorBox = document.getElementById("errorBox");

  btn.addEventListener("click", async () => {
    errorBox.innerHTML = "";
    const email = document.getElementById("email").value.trim();
    const motdepasse = document.getElementById("motdepasse").value;
    if (!email || !motdepasse) {
      errorBox.innerHTML = '<div class="error">Merci de remplir l\'email et le mot de passe.</div>';
      return;
    }
    btn.disabled = true;
    btn.textContent = "Connexion…";
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_PUBLISHABLE_KEY },
        body: JSON.stringify({ email, password: motdepasse }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || "Email ou mot de passe incorrect.");
      // Session stockée en mémoire de session (pas de localStorage, plus sûr) —
      // via sessionStorage, propre à cet onglet, effacée à la fermeture.
      sessionStorage.setItem("skyeco_access_token", data.access_token);
      sessionStorage.setItem("skyeco_user_id", data.user.id);
      window.location.href = "/dashboard.html";
    } catch (err) {
      errorBox.innerHTML = `<div class="error">${err.message}</div>`;
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });
</script>
</body>
</html>
