<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tableau de bord — Skyeco Pro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #14312a;
    background: #f5f8f6;
  }
  header {
    background: #14312a;
    color: white;
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; }
  header button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .wrap { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  .card {
    background: white;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 6px; font-size: 1.15rem; }
  .card p { color: #5b6b64; font-size: 0.92rem; margin: 4px 0; }
  .statut { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
  .statut-actif { background: #eaf4ef; color: #1e6f4c; }
  .statut-impaye, .statut-suspendu { background: #fdeaea; color: #991b1b; }
  .loading, .error { text-align: center; padding: 60px 20px; color: #5b6b64; }

  /* ---- Chat Skyeco ---- */
  .chat-card { padding: 0; overflow: hidden; }
  .chat-header { padding: 20px 24px 14px; }
  .chat-header h2 { margin: 0 0 4px; }
  .chat-messages {
    height: 340px;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fbfcfa;
    border-top: 1px solid #eef1ee;
    border-bottom: 1px solid #eef1ee;
  }
  .chat-empty {
    margin: auto;
    text-align: center;
    color: #8a9490;
    font-size: 0.88rem;
    max-width: 260px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .bubble-client {
    align-self: flex-end;
    background: #1e6f4c;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble-ia {
    align-self: flex-start;
    background: #eef4f0;
    color: #14312a;
    border-bottom-left-radius: 4px;
  }
  .bubble-cyrille {
    align-self: flex-start;
    background: #f0e9da;
    color: #14312a;
    border-bottom-left-radius: 4px;
  }
  .bubble-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    opacity: 0.65;
    margin-bottom: 3px;
    display: block;
  }
  .bubble-loading { align-self: flex-start; color: #8a9490; font-size: 0.85rem; font-style: italic; }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 14px 24px 20px;
  }
  .chat-input-row input {
    flex: 1;
    border: 1.5px solid #d8e3de;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.92rem;
    font-family: inherit;
  }
  .chat-input-row input:focus { outline: none; border-color: #1e6f4c; }
  .chat-input-row button {
    background: #1e6f4c;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }
  .chat-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="data:image/png;base64," alt="" width="26" height="26" style="border-radius:6px; vertical-align:middle; margin-right:8px;">Skyeco Pro</div>
  <button id="btnDeconnexion">Se déconnecter</button>
</header>
<div class="wrap" id="app">
  <div class="loading">Chargement…</div>
</div>
<script>
  const SUPABASE_URL = "https://heviivnlswohnrzcguxv.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_un7u9BDV_1IL3EjYTuAoOg_ZUKZ-ZjW";
  const CHAT_SEND_URL = "/api/chat-skyeco";
  const CHAT_HISTORIQUE_URL = "/api/chat-skyeco-historique";

  const app = document.getElementById("app");
  const token = sessionStorage.getItem("skyeco_access_token");
  if (!token) {
    window.location.href = "/connexion.html";
  }
  document.getElementById("btnDeconnexion").addEventListener("click", () => {
    sessionStorage.clear();
    window.location.href = "/connexion.html";
  });
  const statutLabels = {
    true: "Actif",
    false: "Suspendu",
  };

  const bubbleLabels = { client: "Vous", ia: "Skyeco", cyrille: "Cyrille" };

  function renderMessages(container, messages) {
    if (!messages || messages.length === 0) {
      container.innerHTML = `<div class="chat-empty">Posez vos questions sur votre compte, vos prospects ou le fonctionnement de Skyeco Pro — on vous répond directement ici.</div>`;
      return;
    }
    container.innerHTML = messages
      .map((m) => {
        const cls = m.auteur === "client" ? "bubble-client" : m.auteur === "cyrille" ? "bubble-cyrille" : "bubble-ia";
        const label = m.auteur === "client" ? "" : `<span class="bubble-label">${bubbleLabels[m.auteur] || m.auteur}</span>`;
        return `<div class="bubble ${cls}">${label}${escapeHtml(m.contenu)}</div>`;
      })
      .join("");
    container.scrollTop = container.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function initChat(entrepriseId) {
    const messagesEl = document.getElementById("chatMessages");
    const inputEl = document.getElementById("chatInput");
    const btnEl = document.getElementById("chatSend");
    let history = [];

    (async function chargerHistorique() {
      try {
        const res = await fetch(`${CHAT_HISTORIQUE_URL}?entreprise_id=${encodeURIComponent(entrepriseId)}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();
        if (data.success) {
          history = data.messages || [];
          renderMessages(messagesEl, history);
        }
      } catch (e) {
        renderMessages(messagesEl, []);
      }
    })();

    async function envoyerMessage() {
      const texte = inputEl.value.trim();
      if (!texte) return;
      inputEl.value = "";
      inputEl.disabled = true;
      btnEl.disabled = true;

      history.push({ auteur: "client", contenu: texte });
      renderMessages(messagesEl, history);
      messagesEl.insertAdjacentHTML("beforeend", `<div class="bubble-loading" id="chatLoadingIndicator">Skyeco écrit…</div>`);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch(CHAT_SEND_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ entreprise_id: entrepriseId, message: texte }),
        });
        const data = await res.json();
        const loadingEl = document.getElementById("chatLoadingIndicator");
        if (loadingEl) loadingEl.remove();
        if (data.success) {
          history.push({ auteur: "ia", contenu: data.reponse });
        } else {
          history.push({ auteur: "ia", contenu: data.error || "Une erreur est survenue, réessayez." });
        }
        renderMessages(messagesEl, history);
      } catch (e) {
        const loadingEl = document.getElementById("chatLoadingIndicator");
        if (loadingEl) loadingEl.remove();
        history.push({ auteur: "ia", contenu: "Impossible d'envoyer le message. Réessayez dans un instant." });
        renderMessages(messagesEl, history);
      } finally {
        inputEl.disabled = false;
        btnEl.disabled = false;
        inputEl.focus();
      }
    }

    btnEl.addEventListener("click", envoyerMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") envoyerMessage();
    });
  }

  (async function chargerEntreprise() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/entreprises?select=*&owner_user_id=eq.${encodeURIComponent(await getMyUserId())}`, {
        headers: {
          apikey: SUPABASE_PUBLISHABLE_KEY,
          Authorization: `Bearer ${token}`,
        },
      });
      if (!res.ok) throw new Error("Impossible de charger votre entreprise.");
      const rows = await res.json();
      const entreprise = rows[0];
      if (!entreprise) throw new Error("Aucune entreprise trouvée pour ce compte.");
      if (!entreprise.contrat_accepte || entreprise.paiement_statut !== "valide") {
        window.location.href = "/contrat-paiement.html";
        return;
      }
      const statutClasse = entreprise.abonnement_actif ? "statut-actif" : "statut-suspendu";
      app.innerHTML = `
        <div class="card">
          <h2>${entreprise.nom}</h2>
          <p>Adresse publique de votre formulaire : <strong>/f/${entreprise.slug}</strong> (bientôt disponible)</p>
          <p>Statut de l'abonnement : <span class="statut ${statutClasse}">${statutLabels[entreprise.abonnement_actif] || "Inconnu"}</span></p>
          ${entreprise.plan ? `<p>Formule : <strong>${entreprise.plan}</strong></p>` : ""}
        </div>
        <div class="card chat-card">
          <div class="chat-header">
            <h2>Discuter avec Skyeco</h2>
            <p>Questions sur votre compte, vos prospects reçus, ou le fonctionnement du service.</p>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Écrivez votre message…" />
            <button id="chatSend">Envoyer</button>
          </div>
        </div>
        <div class="card">
          <h2>Votre vitrine</h2>
          <p>Renseignez les informations nécessaires (activité, services, photos, logo, nom de domaine) pour qu'on construise votre vitrine.</p>
          <p><a href="/vitrine-infos.html" style="display:inline-block; margin-top:8px; background:#1e6f4c; color:white; padding:10px 18px; border-radius:10px; text-decoration:none; font-size:0.9rem; font-weight:700;">Remplir les informations →</a></p>
        </div>
      `;
      initChat(entreprise.id);
    } catch (err) {
      app.innerHTML = `<div class="error">${err.message}</div>`;
    }
  })();

  // Récupère l'id de l'utilisateur connecté à partir du token, pour filtrer
  // explicitement la requête sur entreprises (défense en profondeur, en
  // plus des policies RLS côté Supabase).
  async function getMyUserId() {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${token}`,
      },
    });
    if (!res.ok) throw new Error("Session invalide, merci de vous reconnecter.");
    const data = await res.json();
    return data.id;
  }
</script>
</body>
</html>
