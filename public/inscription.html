<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Créer mon compte — Skyeco Pro</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #14312a;
    background: #f5f8f6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: white;
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .brand { font-weight: 800; font-size: 1.3rem; color: #1e6f4c; margin-bottom: 4px; }
  h1 { font-size: 1.3rem; margin: 6px 0 24px; }
  label { display: block; font-weight: 600; font-size: 0.88rem; margin: 16px 0 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d8e3de;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: #1e6f4c; }
  .btn {
    width: 100%;
    background: #1e6f4c;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    margin-top: 24px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.6; }
  .error { color: #991b1b; font-size: 0.88rem; margin-top: 12px; }
  .success { color: #1e6f4c; font-size: 0.95rem; margin-top: 16px; text-align: center; }
  .footer-link { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #5b6b64; }
  .footer-link a { color: #1e6f4c; }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="brand">Skyeco Pro</div>
  <h1>Créer mon compte entreprise</h1>

  <label for="nomEntreprise">Nom de votre entreprise</label>
  <input type="text" id="nomEntreprise" placeholder="Ex : Plomberie Martin" />

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="vous@entreprise.fr" />

  <label for="motdepasse">Mot de passe</label>
  <input type="password" id="motdepasse" placeholder="8 caractères minimum" />

  <button class="btn" id="btnInscription">Créer mon compte</button>
  <div id="errorBox"></div>

  <div class="footer-link">Déjà un compte ? <a href="/connexion.html">Se connecter</a></div>
</div>

<script>
  const SUPABASE_URL = "https://heviivnlswohnrzcguxv.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_un7u9BDV_1IL3EjYTuAoOg_ZUKZ-ZjW";
  const API_URL = "/api/creer-entreprise";

  const btn = document.getElementById("btnInscription");
  const errorBox = document.getElementById("errorBox");

  function slugify(str) {
    return str
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "");
  }

  btn.addEventListener("click", async () => {
    errorBox.innerHTML = "";
    const nomEntreprise = document.getElementById("nomEntreprise").value.trim();
    const email = document.getElementById("email").value.trim();
    const motdepasse = document.getElementById("motdepasse").value;

    if (!nomEntreprise || !email || motdepasse.length < 8) {
      errorBox.innerHTML = '<div class="error">Merci de remplir tous les champs (mot de passe : 8 caractères min).</div>';
      return;
    }

    btn.disabled = true;
    btn.textContent = "Création en cours…";

    try {
      // 1) Création du compte utilisateur via Supabase Auth
      const authRes = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_PUBLISHABLE_KEY,
        },
        body: JSON.stringify({ email, password: motdepasse }),
      });
      const authData = await authRes.json();
      if (!authRes.ok) throw new Error(authData.msg || authData.error_description || "Erreur lors de la création du compte");
      const userId = authData.user?.id || authData.id;
      if (!userId) throw new Error("Compte créé mais identifiant introuvable, contactez le support.");

      // 2) Création de la fiche entreprise liée à ce compte (côté serveur,
      // avec la clé secrète, pour poser un slug unique proprement)
      const entrepriseRes = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          owner_user_id: userId,
          nom: nomEntreprise,
          slug: slugify(nomEntreprise),
          email_contact: email,
        }),
      });
      const entrepriseData = await entrepriseRes.json();
      if (!entrepriseData.success) throw new Error(entrepriseData.error || "Erreur lors de la création de l'entreprise");

      document.getElementById("app").innerHTML = `
        <div class="brand">Skyeco Pro</div>
        <div class="success">✅ Compte créé ! Vérifiez votre email pour confirmer votre adresse, puis connectez-vous.</div>
      `;
    } catch (err) {
      errorBox.innerHTML = `<div class="error">${err.message}</div>`;
      btn.disabled = false;
      btn.textContent = "Créer mon compte";
    }
  });
</script>
</body>
</html>
